# The Xcode project, as a file a human can read and a diff can show.
#
# `build.sh` regenerates AdiFleet.xcodeproj from this with `xcodegen`. The generated project is
# committed too, so opening the app needs Xcode and nothing else — but this file is the source of
# truth, and a setting changed only in Xcode's UI will be overwritten by the next generate.

name: AdiFleet

options:
  bundleIdPrefix: family.adi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # The Rust staticlib is built by `build.sh`, not by Xcode, so a stale artifact must never be
  # silently linked: `build.sh` builds it before every `xcodebuild` invocation it makes.
  generateEmptyDirectories: false

settings:
  base:
    # Swift 5 language mode. Swift 6's strict concurrency has opinions about `@MainActor` views
    # calling into an actor that are worth adopting deliberately, in their own change, rather than
    # as a side effect of a project file.
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  AdiFleet:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AdiFleet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: family.adi.fleet
        PRODUCT_NAME: AdiFleet
        INFOPLIST_FILE: AdiFleet/Info.plist
        # The build number App Store Connect sees. It must strictly increase across uploads and a
        # number is never reusable, so this is bumped per upload, not per release. Build 1 was
        # accepted on 2026-08-05; 2 followed on 2026-08-31 and predates the QR scanner, so it is
        # not submittable. 3 is the first build that has it, and is the one App Review rejected on
        # 2026-09-02: the reviewer's token was refused by a paste parser that only accepted the
        # exact string it was minted as. 4 carries the fix for that. `Info.plist` reads both of
        # these through $(...) rather than repeating them.
        CURRENT_PROJECT_VERSION: 4
        MARKETING_VERSION: 0.1.0
        TARGETED_DEVICE_FAMILY: "1,2"

        # App Store Connect refuses a build with no icon, so this is not decoration. One
        # 1024×1024 entry is all iOS 17 wants — the system derives every other size and applies
        # the corner mask itself, which is why the art is full-bleed with no rounded corners or
        # alpha of its own (it is `apps/macos/ADI.icns` with its macOS padding cropped away).
        #
        # Compiling it needs a **simulator runtime matching the SDK**, even for a device build:
        # without one, actool fails every build with "No simulator runtime version from [...]
        # available to use with iphonesimulator SDK version". Install with
        # `xcodebuild -downloadPlatform iOS` (~8.5 GB) if a checkout suddenly cannot build.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

        # The C surface. The header lives with the crate that implements it, so the two cannot drift.
        SWIFT_OBJC_BRIDGING_HEADER: AdiFleet/Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../../crates/adi-mesh-ffi/include

        # The Rust core. Always the release profile, in both Xcode configurations: a debug build of
        # iroh is enormous (hundreds of MB of staticlib) and slow enough to be felt on a phone, and
        # nothing in this app is debugged by stepping into Rust from Xcode.
        OTHER_LDFLAGS: -ladi_mesh_ffi
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]: $(SRCROOT)/../../target/aarch64-apple-ios-sim/release
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]: $(SRCROOT)/../../target/aarch64-apple-ios/release

        # Only arm64. The simulator SDK on Apple silicon still offers x86_64, and a build that
        # takes it links against a Rust staticlib that does not have it — which surfaces as
        # hundreds of "ignoring file … found architecture 'arm64'" warnings and then an undefined
        # symbol for every entry point, rather than as the platform mismatch it is.
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

        # Automatic signing against whichever team is set here. The app needs no capability, no
        # entitlement and no paid membership — a viewer only ever dials out — so any team with a
        # development certificate can put it on a device. Override without editing this file:
        #   DEVELOPMENT_TEAM=XXXXXXXXXX ./build.sh device
        CODE_SIGN_STYLE: Automatic
        # A free "Personal Team" would be enough — the app declares no capability, so there is
        # nothing here a paid membership unlocks — but this is not one. 752556J5V6 is the paid
        # "IHOR HERASYMOVYCH" team, and the difference is worth knowing before you plan around it:
        # a free team's provisioning profile expires after **seven days** and the build stops
        # launching, while this one is minted for a **year** (the installed build's profile runs to
        # 2027-07-31). Nothing here has to be reinstalled weekly.
        DEVELOPMENT_TEAM: 752556J5V6
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    dependencies:
      # What the Rust core pulls in: TLS and key handling, and the interface/route watcher iroh
      # uses to notice the network changing under a phone that moves between Wi-Fi and cellular.
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework

  # The screenshot harness. It exists because `simctl` can boot, install and screenshot but cannot
  # **tap** — so without a UI test nothing can navigate to the screen being photographed, and the
  # only shot obtainable is the launch screen. (The other way round is granting osascript
  # accessibility and driving Simulator with clicks, which is a manual ritual repeated on every
  # redesign and cannot be handed to a second language.)
  #
  # It is a screenshot harness first and a test second: it asserts only enough to make sure a
  # green run cannot have photographed an empty or wrong screen.
  AdiFleetUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AdiFleetUITests
    dependencies:
      - target: AdiFleet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: family.adi.fleet.uitests
        # The app target points INFOPLIST_FILE at its own hand-written plist; this one has no plist
        # and needs none of what is in the app's, so it takes the generated one. Without this the
        # build fails at signing with "the target does not have an Info.plist file", which reads
        # like a signing problem and is not one.
        GENERATE_INFOPLIST_FILE: "YES"
        # Simulator-only, ad-hoc signed. Nothing here is ever archived or uploaded, so it needs no
        # profile and deliberately does not carry the app's.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 752556J5V6
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        TEST_TARGET_NAME: AdiFleet

# Declared rather than left to Xcode's autocreation. An autocreated scheme is not written to disk,
# so `xcodebuild -scheme AdiFleet` gets one with no buildables — which it reports as "Supported
# platforms … is empty" and then as having no eligible destination at all, naming the SDK as the
# culprit when the scheme is.
schemes:
  AdiFleet:
    build:
      targets:
        AdiFleet: all
    run:
      config: Debug
    # Release, because this is the configuration TestFlight ships. Archiving Debug would upload a
    # build with assertions live and optimisation off — it would install and run, which is exactly
    # what makes the mistake survive review.
    archive:
      config: Release

  # A separate scheme, so the release path above is untouched by anything the screenshot harness
  # needs. `AdiFleet` still builds and archives exactly one target; adding the test target to it
  # would put a test bundle in the dependency graph of the thing that gets uploaded.
  AdiFleetShots:
    build:
      targets:
        AdiFleet: all
        AdiFleetUITests: [test]
    test:
      config: Debug
      targets:
        - AdiFleetUITests
