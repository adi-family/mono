<!doctype html><meta charset=utf-8>
<title>adi Fleet — App Store panel</title>
<!--
  One App Store panel. Everything variable arrives in the query string, so this file is the
  composition and `frames.sh` is the only place that knows which shot gets which words:

    panel.html?w=1320&h=2868&shot=../shots/iphone/04-fleet.png
              &head=Every+machine+you+run,%0Ain+your+pocket
              &sub=Pair+once.+They+are+all+just+there.
              &sw=1320&sh=2868&dw=0.80

  `sw`/`sh` are the screenshot's own pixel size — the device's height is derived from them so the
  frame can never squash the artefact. `dw` is the device width as a fraction of the panel.

  Rendered by Chrome rather than composited in Pillow: the composition is CSS against the design
  tokens (design/DESIGN.md), with Geist set from the crate that ships it, and a browser is what
  lays that out the way every other surface is laid out.
-->
<link rel=stylesheet href=_frame.css>


<div class=mark><img src=_mark.svg alt=""><span>ADI</span></div>

<div class=copy>
  <h1></h1>
  <p></p>
</div>

<div class=stage>
  <div class=device>
    <div class=screen><img alt=""></div>
    <div class=island></div>
  </div>
</div>

<script>
  const q = new URLSearchParams(location.search);
  // `mode=plate` renders the composition with the copy removed. It is not a debug view: it is
  // how contrast gets measured against the real background instead of against the antialiased
  // edge of the glyph next door, which is what measuring on the full render actually does.
  if (q.get("mode") === "plate") document.documentElement.classList.add("plate");
  const root = document.documentElement.style;

  const w = +q.get("w"), h = +q.get("h");
  root.setProperty("--w", w + "px");
  root.setProperty("--h", h + "px");
  root.setProperty("--shot-w", q.get("sw"));
  root.setProperty("--shot-h", q.get("sh"));
  root.setProperty("--device-w", q.get("dw") || ".80");
  // Type is sized off its own base, not off the panel width: the tablet panel is far wider
  // relative to its height, and type scaled off width ran the subhead into the device.
  root.setProperty("--tb", (q.get("tb") || w) + "px");
  root.setProperty("--stage-top", q.get("st") || ".205");

  // textContent, then newlines become <br>. Set as text first so a headline can never inject
  // markup — these strings come from a shell script and one stray ampersand should not be able
  // to rewrite the composition.
  const h1 = document.querySelector(".copy h1");
  h1.textContent = q.get("head") || "";
  h1.innerHTML = h1.innerHTML.replace(/\n/g, "<br>");
  document.querySelector(".copy p").textContent = q.get("sub") || "";

  // The frame is the device the capture came from — `kind=tablet` swaps the rail, the corner
  // radius and removes the island. A phone frame around a 4:3 screenshot is an object that does
  // not exist, and it shipped once.
  if (q.get("kind") === "tablet") document.querySelector(".device").classList.add("tablet");

  document.querySelector(".screen img").src = q.get("shot");

  // The renderer waits for this. Without it Chrome will happily screenshot the frame before the
  // screenshot inside it has decoded, and the panel comes out as a black phone — which looks
  // deliberate enough that it survived two runs the first time this pipeline was built.
  const img = document.querySelector(".screen img");
  const done = () => document.documentElement.setAttribute("data-ready", "1");
  if (img.complete) { done(); } else { img.onload = done; img.onerror = done; }
</script>
