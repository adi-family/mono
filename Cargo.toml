[workspace]
resolver = "3"
members = ["crates/*"]
# adi-webapp and adi-ui target wasm32 and are built by Trunk, never by a native
# `cargo build`. Keep them out of the default set so `cargo build`/`cargo test` (no
# `--workspace`) skip them; they stay members so they still inherit workspace
# metadata/lints and build with `-p … --target wasm32-unknown-unknown`.
default-members = [
    "crates/adi-agents",
    "crates/adi-app",
    "crates/adi-cli",
    "crates/adi-config",
    "crates/adi-core",
    "crates/adi-css",
    "crates/adi-db",
    "crates/adi-dns",
    "crates/adi-events",
    "crates/adi-fs",
    "crates/adi-hive",
    "crates/adi-hooks",
    "crates/adi-indexer",
    "crates/adi-knowledge",
    "crates/adi-mesh",
    "crates/adi-mesh-ffi",
    "crates/adi-ports-manager",
    "crates/adi-projects",
    "crates/adi-pty",
    "crates/adi-secrets",
    "crates/adi-tasks",
    "crates/adi-tools",
    "crates/adi-triggers",
    "crates/adi-update",
    "crates/adi-webapp-api",
]

# Shared metadata inherited by member crates via `field.workspace = true`.
# Where `cargo dylint` looks for this tree's lints. Without it the command every doc
# gives — `cargo dylint --lib adi_clone_lint --workspace` — fails with "Could not find
# `--lib adi_clone_lint`", because dylint has no other way to learn the library exists.
# The path is a workspace of its own (a `rustc_private` crate can never join this one),
# which is why it is named here rather than in `members`.
[workspace.metadata.dylint]
libraries = [{ path = "lints/adi-clone-lint" }]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
# Business Source License 1.1 (see LICENSE); BUSL-1.1 is its SPDX identifier.
license = "BUSL-1.1"
authors = ["mgorunuch <alkudel.ui@gmail.com>"]
repository = "https://github.com/adi-family/mono"

# Central dependency versions. Member crates reference these with
# `some-dep = { workspace = true }` so versions stay aligned repo-wide.
[workspace.dependencies]
# Internal crates
adi-agents = { path = "crates/adi-agents" }
adi-config = { path = "crates/adi-config" }
adi-core = { path = "crates/adi-core" }
adi-css = { path = "crates/adi-css" }
adi-db = { path = "crates/adi-db" }
adi-events = { path = "crates/adi-events" }
adi-fs = { path = "crates/adi-fs" }
adi-hive = { path = "crates/adi-hive" }
adi-hooks = { path = "crates/adi-hooks" }
adi-indexer = { path = "crates/adi-indexer" }
adi-knowledge = { path = "crates/adi-knowledge" }
adi-mesh = { path = "crates/adi-mesh" }
adi-mesh-ffi = { path = "crates/adi-mesh-ffi" }
adi-osext = { path = "crates/adi-osext" }
adi-ports-manager = { path = "crates/adi-ports-manager" }
adi-projects = { path = "crates/adi-projects" }
adi-pty = { path = "crates/adi-pty" }
adi-secrets = { path = "crates/adi-secrets" }
adi-tasks = { path = "crates/adi-tasks" }
adi-tools = { path = "crates/adi-tools" }
adi-triggers = { path = "crates/adi-triggers" }
adi-ui = { path = "crates/adi-ui" }
adi-update = { path = "crates/adi-update" }
adi-webapp-api = { path = "crates/adi-webapp-api" }

# External crates (add as needed)
# Authenticated encryption + base64 for adi-secrets' at-rest secret storage.
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
# Peer-to-peer QUIC transport with relay-assisted NAT traversal and dial-by-EndpointId
# discovery; the backbone of adi-mesh.
iroh = "1"
# In-process pseudo-terminal session manager (adi-pty): a real pty per session (ConPTY on Windows),
# a vt100 screen model fed by a reader thread — the cross-platform replacement for the external tmux
# server that interactive agent runs and workspace terminals used to be driven through.
portable-pty = "0.9"
vt100 = "0.16"
# The shared SQLite store (adi-db). `bundled` compiles SQLite itself into the binary instead of
# linking a system library, so every target — including the mingw Windows cross-build — ships the
# same engine, and the store's WAL files are never read by a different, older SQLite.
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OpenAI's BPE, ranks compiled in — no model load, no network. Used by adi-agents' transcript
# analytics to count what a conversation spent its context on in tokens rather than characters,
# which is the only unit in which "this was sent six times" is a cost.
tiktoken-rs = "0.12"
# Reflects `#[derive(JsonSchema)]` types into JSON Schema — the source of truth for the payload
# shape of every platform event (see adi-tasks / adi-agents event catalogs).
schemars = "1"
toml = "1"
uuid = { version = "1", features = ["v4"] }
# The async runtime. Listed with no features: a runtime is only ever as big as the drivers the
# crate using it asks for, and those differ per crate (adi-cli builds one inside a single
# subcommand, adi-hive wants process + io-util). Members add their own with
# `tokio = { workspace = true, features = [...] }` — cargo unions them per build.
tokio = "1"
# Structured logging. `tracing` is the facade every crate records through; only the three
# binaries that own a process (adi-app, adi-dns, adi-hive) also install a subscriber.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Error plumbing: `anyhow` where a binary just needs a cause to print, `thiserror` where a
# library owes its callers a typed error they can match on.
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
# Content addressing — the indexer's parse/embed cache, knowledge note staleness, the updater's
# artifact checksum, and the mesh's password digest all hash the same way.
sha2 = "0.11"
hex = "0.4"
# The `harness:adi` tool loop's Grep runs a real regular expression.
regex = "1"
# HTTP client. rustls rather than native-tls so no target needs a system OpenSSL — see the
# note in adi-indexer's Cargo.toml about what feature unification does to the musl node build.
#
# `rustls-no-provider`, not `rustls`: as of 0.13 the plain `rustls` feature hard-wires the
# aws-lc-rs provider, which wants cmake and a C toolchain and would put C crypto back into the
# static musl build (apps/linux/build.sh). The no-provider variant is what iroh already selects,
# so the whole graph stays on `ring` — but it also means *nobody* picks a provider for us, and a
# client cannot be built until one is installed process-wide. See `tls::ensure_provider`.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# The TLS implementation itself. `ring` rather than the default aws-lc-rs provider: no cmake, no
# C toolchain, so the build stays as portable as the rest of the workspace.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
# The maintained fork of the archived serde_yaml; hive.yaml and the webapp's YAML views parse
# through it.
serde_yaml_ng = "0.10"
# Randomness: per-credential salts and the join nonce/password (adi-mesh).
rand = "0.10"
# Mints the front door's local CA and leaf in-process, so a fresh machine needs no openssl/mkcert.
rcgen = "0.14"
# Scratch directories for tests.
tempfile = "3"
# Lints applied workspace-wide; member crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"
rust_2024_compatibility = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Faster incremental builds while keeping release builds optimized.
[profile.release]
lto = "thin"
codegen-units = 1
