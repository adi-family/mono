name: Release

# Cutting a release is `git tag v0.2.0 && git push --tags`. The tag is the source of truth for
# the version: every job exports it as ADI_VERSION, `scripts/version.sh` hands that to the
# packaging scripts, and the binaries compile it in — so the bundle's Info.plist, the node's
# VERSION file, `adi-mono --version` and the published manifest can never disagree.
#
# The last job writes `manifest.json` — the file every installed copy of adi polls — and
# attaches it to the release. `manifest_url` defaults to the *latest* release's copy, so
# publishing here is the whole act of shipping an update to every machine.
#
# Required repository secrets (the macOS job is the only one that needs any):
#   MACOS_CERT_P12         base64 of the "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD    its export password
#   APPLE_ID               Apple ID used for notarization
#   APPLE_APP_PASSWORD     app-specific password for that Apple ID
#   APPLE_TEAM_ID          Developer team ID (must match adi-update's DEFAULT_TEAM_ID)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (no leading v). Builds and uploads artifacts, publishes nothing.'
        required: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned rather than "latest": a packaging tool that changes under a release build is a
  # class of surprise worth spending one line to avoid.
  TRUNK_VERSION: v0.21.14

jobs:
  # ── the version, resolved once and reused ────────────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
            version="${tag#v}"
            publish=true
          else
            version="${{ inputs.version }}"
            tag="v$version"
            publish=false
          fi
          # Same rule the client enforces: adi-update ignores anything that is not
          # major[.minor[.patch]], so a tag it cannot parse would ship un-updatable machines.
          case "$version" in
            ''|*[!0-9.]*|*..*|.*|*.)
              echo "::error::'$version' is not a major[.minor[.patch]] version — tag releases as v0.2.0"
              exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (version $version, publish=$publish)"

      # Here, and not in `publish`: the notes are what every machine is shown before it takes
      # this release, and finding out they were never written after three platforms have spent
      # half an hour building is finding out too late. Ten seconds, before any of it starts.
      #
      # Only when actually publishing — a workflow_dispatch is how the build itself is
      # rehearsed, at a version that may never be tagged, and that should not need an entry.
      - name: Check CHANGELOG.md has this release's section
        run: |
          if scripts/changelog.sh "${{ steps.resolve.outputs.version }}" > /dev/null; then
            echo "CHANGELOG.md has a section for ${{ steps.resolve.outputs.version }}."
          elif [ "${{ steps.resolve.outputs.publish }}" = "true" ]; then
            echo "::error::CHANGELOG.md has no section for ${{ steps.resolve.outputs.version }} — write the entry (or rename '## Unreleased'), commit, and re-tag"
            exit 1
          else
            echo "::warning::no CHANGELOG.md section for ${{ steps.resolve.outputs.version }} — fine for a dry run, but a real tag would be refused"
          fi

  # ── the webapp, built once and handed to all three platform jobs ─────────────────────────
  #
  # The control panel's UI is wasm: one artifact, byte-for-byte the same whichever machine
  # produced it, embedded into adi-app by every platform's packaging script. Built per-job it
  # cost 13m41s of runner time on v1.2.0 (6m56s of it on the macOS runner, which is both the
  # slowest and the dearest) to produce the same bundle three times.
  #
  # It is a job rather than a step in `version` so its failure names itself, and so the
  # platform jobs' `needs:` says plainly what they are waiting for. `needs: version` keeps the
  # cheap gates — a malformed tag, a missing changelog section — in front of every build.
  webapp:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Toolchain (wasm)
        run: rustup target add wasm32-unknown-unknown

      - name: Install trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xzf - -C /usr/local/bin
          trunk --version

      - name: Build the webapp
        run: cd crates/adi-webapp && trunk build --release

      # `dist/` is the contract — `scripts/require-webapp-dist.sh`, which every packaging
      # script runs, asserts index.html and a .wasm are in it. Short retention: this is
      # scaffolding for the run, not something anyone downloads from the release.
      - uses: actions/upload-artifact@v4
        with:
          name: webapp-dist
          path: crates/adi-webapp/dist
          if-no-files-found: error
          retention-days: 1

  # ── macOS: the notarized universal bundle, as a DMG ──────────────────────────────────────
  macos:
    needs: [version, webapp]
    # macos-15, not -14: the older image ships Swift 5.10, which rejects concurrency patterns
    # the Swift 6 toolchain on a developer's machine accepts. A release build that compiles
    # locally and fails only here — 15 minutes in, after the Rust build — is a bad trade for
    # an older image nothing else needs.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ADI_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing secrets are present
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Fail here rather than three minutes into a build that cannot be shipped anyway:
          # an unsigned or un-notarized bundle is refused by Gatekeeper on every other Mac,
          # and by adi-update's own Team ID check.
          missing=""
          for name in CERT CERT_PASSWORD APPLE_ID APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::missing repository secrets:$missing"; exit 1; }

      - uses: Swatinem/rust-cache@v2

      - name: Toolchain versions
        run: |
          # Printed because the app bundles Swift as well as Rust, and a Swift-version
          # mismatch between here and a developer's machine is otherwise invisible in the log.
          swiftc --version
          xcodebuild -version
          rustc --version

      # The bundle is universal, so `target/` carries two full release builds, and the DMG needs
      # room for a copy of the finished .app on top of that. v0.3.1's first attempt compiled,
      # signed and notarized cleanly and then died on `hdiutil: create failed - No space left
      # on device` — the very last step. The runner's preinstalled Android SDK is ~14GB and
      # nothing here has ever touched it.
      - name: Make room for the universal build and the DMG
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf ~/Library/Android/sdk /Users/runner/Library/Android || true
          sudo rm -rf ~/.rustup/toolchains/*/lib/rustlib/{aarch64,x86_64}-apple-ios* || true
          echo "after:"; df -h / | tail -1

      - name: Rust targets (the bundle is universal)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Built once, in the `webapp` job — the wasm is identical on all three platforms, and
      # this is the slowest runner we own. `apps/macos/build.sh` calls
      # `scripts/require-webapp-dist.sh`, so an artifact that failed to arrive stops the build
      # rather than embedding an empty directory.
      - name: Take the webapp built once
        uses: actions/download-artifact@v4
        with:
          name: webapp-dist
          path: crates/adi-webapp/dist

      - name: Import the Developer ID certificate
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # A throwaway keychain: unlocked for this job only, never the runner's login one.
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on an interactive "allow access?" prompt nobody
          # is there to answer, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Two steps, not one. Together they are the whole macOS job; apart, the log finally says
      # which half of it is ours. The first is cargo (twice — the bundle is universal), swiftc
      # and hdiutil, and it is the one a build change can move. The second is Apple's notary
      # queue, which we neither control nor should try to optimise: a jump there is weather,
      # not a regression. Nothing to tell them apart is why "it got 9 minutes slower" sat
      # unexplained between v1.1.0 and v1.2.0.
      - name: Build and sign the universal bundle
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: apps/macos/release.sh build

      - name: Notarize and staple (waits on Apple)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AC_USER: ${{ secrets.APPLE_ID }}
          AC_PASS: ${{ secrets.APPLE_APP_PASSWORD }}
        run: apps/macos/release.sh notarize

      - name: Confirm the DMG is stapled
        run: |
          # release.sh warns and continues when notarization is skipped; a release must not.
          xcrun stapler validate apps/macos/build/ADI.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: apps/macos/build/ADI.dmg
          if-no-files-found: error

  # ── Linux: the static musl node package ──────────────────────────────────────────────────
  linux:
    needs: [version, webapp]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ADI_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # Nothing else here needs a host toolchain: the musl half is a native build inside
      # Alpine, and the wasm half arrives prebuilt from the `webapp` job.
      # `apps/linux/build.sh` calls `scripts/require-webapp-dist.sh` before it packages.
      - name: Take the webapp built once
        uses: actions/download-artifact@v4
        with:
          name: webapp-dist
          path: crates/adi-webapp/dist

      # The musl half is built inside Alpine, whose *own* libc is musl — so this is a native
      # compile, not a cross one, and the toolchain question disappears instead of being worked
      # around. `musl-tools`, which this used to install, is a C compiler only; usearch (reached
      # through adi-indexer) is C++, and Ubuntu ships no musl C++ at all. The prebuilt
      # musl-cross-make tarballs that would supply one stop at GCC 11, which is too old for
      # usearch's SIMD backend, and zig's clang fails on the same code. Alpine 3.22 is GCC 14.
      #
      # Everything the build needs is on the mounted workspace, including the `dist/` downloaded
      # above; only rustup is fetched inside. Output lands in `target/` as root, which the
      # upload step after this reads without trouble.
      - name: Build the node package (Alpine — musl is native there)
        run: |
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e ADI_VERSION \
            alpine:3.22 sh -euc '
              apk add --no-cache build-base curl bash git tar file >/dev/null
              curl -fsSL https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable >/dev/null
              . "$HOME/.cargo/env"
              # `scripts/version.sh` shells out to git, and the checkout is owned by the
              # runner user rather than by root inside here.
              git config --global --add safe.directory /w
              ./apps/linux/build.sh
            '

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: apps/linux/build/adi-linux-x64.tar.gz
          if-no-files-found: error

  # ── Windows: cross-compiled with mingw, same as the local packaging route ────────────────
  windows:
    needs: [version, webapp]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ADI_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Toolchain (mingw-w64)
        run: |
          # nsis builds ADI-Setup-x64.exe. NSIS is itself a cross-compiler — the installer it
          # produces here is the same executable it would produce on Windows — so the whole
          # Windows release stays one Linux job.
          sudo apt-get update && sudo apt-get install -y mingw-w64 zip nsis
          rustup target add x86_64-pc-windows-gnu
          # usearch (through adi-indexer) includes <Windows.h>; mingw-w64 ships the header as
          # `windows.h`. On Windows and on macOS the filesystem is case-insensitive and the
          # difference never surfaces — which is exactly why this only ever fails here, and why
          # it built on a developer's Mac while every CI run died on it.
          for d in /usr/x86_64-w64-mingw32/include /usr/share/mingw-w64/include; do
            [ -f "$d/windows.h" ] && [ ! -e "$d/Windows.h" ] \
              && sudo ln -s windows.h "$d/Windows.h" && echo "linked $d/Windows.h"
          done
          # Ubuntu's mingw defaults to the *win32* threading model, whose libgcc pulls in
          # `gthr-win32.o` and its undefined `__mingwthr_key_dtor`. Nothing referenced that
          # while the tree was C-only; linking C++ (`-lstdc++`, via usearch → link-cplusplus)
          # does, and the link fails at the very last step. The posix variant Ubuntu also ships
          # does not have the problem — and is what Homebrew's mingw defaults to, which is why
          # this links on a developer's Mac.
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          x86_64-w64-mingw32-gcc -v 2>&1 | grep -i "thread model" || true

      # `apps/windows/build.sh` calls `scripts/require-webapp-dist.sh` before it packages.
      - name: Take the webapp built once
        uses: actions/download-artifact@v4
        with:
          name: webapp-dist
          path: crates/adi-webapp/dist

      - name: Build the Windows package
        run: apps/windows/build.sh

      # Two files, and they are not interchangeable. The installer is what a person downloads;
      # the zip is what the auto-updater takes, and what an unattended install unpacks.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            apps/windows/build/ADI-windows-x64.zip
            apps/windows/build/ADI-Setup-x64.exe
          if-no-files-found: error

  # ── the manifest, and the release itself ─────────────────────────────────────────────────
  publish:
    needs: [version, macos, linux, windows]
    # Run even when a platform job failed: a broken Windows cross-compile should not also
    # withhold the macOS and Linux updates. What did not build is named in the release notes
    # rather than silently omitted — an absent artifact means that platform stops updating,
    # and nobody should have to diff two manifests to discover it.
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # By name, not everything: `webapp-dist` is scaffolding passed between build jobs, and
      # downloading a wasm bundle nothing here reads only invites someone to publish it.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '{macos,linux-x86_64,windows-x86_64}'

      - name: Assemble manifest.json
        id: manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          PUBLISH: ${{ needs.version.outputs.publish }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          declare -a ARGS=() ASSETS=() MISSING=()

          add() { # add <platform> <path>
            if [ -f "$2" ]; then
              ARGS+=(--artifact "$1=$2"); ASSETS+=("$2")
            else
              MISSING+=("$1")
            fi
          }
          add macos          artifacts/macos/ADI.dmg
          add linux-x86_64   artifacts/linux-x86_64/adi-linux-x64.tar.gz
          add windows-x86_64 artifacts/windows-x86_64/ADI-windows-x64.zip

          # The Windows installer is attached to the release but is deliberately *not* a manifest
          # artifact: the manifest names update payloads, and an update unpacks an archive into
          # the install directory rather than running setup again. A machine handed this file by
          # the updater would try to unzip an installer and fail every check from then on.
          SETUP=artifacts/windows-x86_64/ADI-Setup-x64.exe
          if [ -f "$SETUP" ]; then ASSETS+=("$SETUP"); fi

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::warning::no artifact built for: ${MISSING[*]} — those platforms will not see this release"
          fi
          [ ${#ARGS[@]} -gt 0 ] || { echo "::error::every platform failed to build; nothing to publish"; exit 1; }

          # The release notes, written by hand in CHANGELOG.md and lifted out here. The
          # `version` job already refused a publish that has no section, so this only falls
          # back on the dry-run path.
          if ! scripts/changelog.sh "$VERSION" > release-notes.md; then
            if [ "$PUBLISH" = "true" ]; then exit 1; fi
            printf 'ADI v%s\n' "$VERSION" > release-notes.md
          fi

          # A platform that failed to build publishes no artifact, which means it stops
          # updating — said in the notes rather than left for someone to find by diffing two
          # manifests.
          if [ ${#MISSING[@]} -gt 0 ]; then
            printf '\n---\n\nNo build for: %s. Those platforms stay on the version they are on.\n' \
              "${MISSING[*]}" >> release-notes.md
          fi

          scripts/manifest.sh --version "$VERSION" --base-url "$BASE" \
            --notes "$(cat release-notes.md)" "${ARGS[@]}" > manifest.json
          cat manifest.json

          # One line, space separated: this is interpolated straight into the `gh release
          # create` argument list, and a multi-line output would break apart into separate
          # shell commands there. The notes go by file for exactly that reason — see the
          # publish step.
          echo "assets=${ASSETS[*]} manifest.json" >> "$GITHUB_OUTPUT"

      - name: Check the manifest is what the client expects
        run: |
          # The manifest is the one file that, if malformed, silently stops every machine from
          # updating — including the machines that would receive the fix. Parse it here.
          python3 - <<'PY'
          import json, sys
          m = json.load(open('manifest.json'))
          assert m['version'], 'no version'
          arts = m.get('artifacts') or {}
          assert arts, 'no artifacts'
          for name, a in arts.items():
              assert a['url'].startswith('https://'), f'{name}: url must be https'
              assert len(a['sha256']) == 64, f'{name}: sha256 looks wrong'
              assert a.get('size', 0) > 0, f'{name}: empty artifact'
          # Older clients read only the top-level `dmg`; if a macOS build exists it must be there.
          if 'macos' in arts:
              assert m.get('dmg', {}).get('sha256') == arts['macos']['sha256'], \
                  'the legacy dmg field must mirror the macos artifact'
          print('manifest OK:', m['version'], list(arts))
          PY

      - name: Publish the release
        if: ${{ needs.version.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # --latest matters: the default manifest_url points at `releases/latest/download/`,
          # so a release that is not marked latest reaches nobody.
          # --notes-file, not --notes: the notes are a whole changelog section, and a
          # multi-line value interpolated into this argument list would break apart into
          # separate shell commands.
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "ADI $TAG" \
            --notes-file release-notes.md \
            --latest \
            ${{ steps.manifest.outputs.assets }}
          echo "published: https://github.com/${{ github.repository }}/releases/tag/$TAG"

      - name: Dry run summary
        if: ${{ needs.version.outputs.publish != 'true' }}
        run: |
          echo "workflow_dispatch: artifacts and manifest built, nothing published."
