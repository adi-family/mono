name: Windows

# Real-Windows validation of the cross-platform port: the host build is macOS, so this is the
# only place the Windows code paths (Task Scheduler supervision, NRPT routing, tasklist/taskkill,
# %USERPROFILE% home resolution) are compiled with MSVC and executed on genuine Windows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins stable; rustup on the runner honors it on first cargo call.
      - name: Rust versions
        run: |
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      # Run the unit tests for the crates that hold the port's core logic — all verified
      # cross-platform — with windows-msvc: the schtasks task-XML builder, ISO-8601 durations,
      # UTF-16 encoding, the :53 DNS config, %USERPROFILE% home resolution, and the detached
      # agent backend (tasklist/taskkill liveness). `--no-fail-fast` reports every failure at
      # once rather than stopping at the first crate.
      #
      # The build step below still compiles the *entire* tree (hooks/triggers/tools)
      # for Windows. Those crates' unit tests are not run here because they exercise Unix *shell*
      # features (`sh -c` triggers/hooks/runners, process-group orphan reaping) — the surface
      # explicitly documented as not-yet-ported in apps/windows/README.md.
      - name: Unit tests (windows-msvc)
        run: >
          cargo test --no-fail-fast
          -p adi-osext -p adi-config -p adi-secrets -p adi-core -p adi-agents -p adi-launcher

      # adi-launcher is `ADI.exe`, the only one of these a person ever names. It is compiled here
      # for the same reason as the rest — it is Windows-only code written on a Mac — though its
      # icon is not: the resource compiler is mingw's `windres`, and the crate's build script
      # skips the resources under MSVC rather than failing. Nothing that ships is built this way.
      - name: Build release binaries
        run: cargo build --release -p adi-cli -p adi-dns -p adi-hive -p adi-app -p adi-launcher

      # Read-only smoke test: proves the binary runs on real Windows, resolves its store under
      # %USERPROFILE%, and that the status pipeline actually shells out to `schtasks /Query`
      # (is_loaded) and `tasklist` (process_alive) and emits valid JSON.
      - name: CLI smoke test (read-only)
        shell: pwsh
        run: |
          $exe = "target\release\adi-mono.exe"
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "adi-mono --help exited $LASTEXITCODE" }
          Write-Host "`n--- status --json ---"
          $json = & $exe status --json
          Write-Host $json
          $null = $json | ConvertFrom-Json   # throws if not valid JSON
          Write-Host "`nOK: status --json is valid; schtasks /Query + tasklist ran on real Windows."

      # Exercises the actual DNS resolver on Windows: run adi-dns.exe with a `.test` override and
      # confirm it answers. No scheduling, no elevation — just the daemon. On Windows the resolver
      # always binds :53 (effective_ports forces it — NRPT can't target a custom port), so query
      # 127.0.0.1:53 directly. Its stdout/stderr are captured and dumped if anything goes wrong.
      - name: DNS resolver smoke test
        shell: pwsh
        run: |
          $cfg = "ci-dns.toml"
          @"
          domain = "test"
          bind_addr = "127.0.0.1"
          fallback_ports = []
          upstreams = ["1.1.1.1:53"]
          manage_os_routing = false
          status_file = "ci-dns-status.json"
          [[overrides]]
          suffix = "test"
          address = "127.0.0.9"
          "@ | Set-Content -Encoding utf8 $cfg
          $p = Start-Process -FilePath "target\release\adi-dns.exe" -ArgumentList $cfg -PassThru `
                 -RedirectStandardOutput dns-out.log -RedirectStandardError dns-err.log
          try {
            # Wait until the resolver is actually listening on UDP :53 (up to ~8s).
            $listening = $false
            for ($i = 0; $i -lt 16; $i++) {
              Start-Sleep -Milliseconds 500
              if (Get-NetUDPEndpoint -LocalPort 53 -LocalAddress 127.0.0.1 -ErrorAction SilentlyContinue) { $listening = $true; break }
            }
            if (-not $listening) { throw "adi-dns.exe never bound 127.0.0.1:53" }
            Write-Host "adi-dns.exe is listening on 127.0.0.1:53"

            # Raw UDP A-query for foo.test (Resolve-DnsName has no custom-port arg).
            $q = [byte[]](0x12,0x34, 0x01,0x00, 0x00,0x01, 0x00,0x00, 0x00,0x00, 0x00,0x00,
                          0x03,0x66,0x6f,0x6f, 0x04,0x74,0x65,0x73,0x74, 0x00, 0x00,0x01, 0x00,0x01)
            $udp = [System.Net.Sockets.UdpClient]::new()
            $udp.Client.ReceiveTimeout = 3000
            $udp.Connect("127.0.0.1", 53)
            [void]$udp.Send($q, $q.Length)
            $ep = [System.Net.IPEndPoint]::new([System.Net.IPAddress]::Any, 0)
            $resp = $udp.Receive([ref]$ep)
            $udp.Close()
            $ans = ($resp[6] -shl 8) -bor $resp[7]   # ANCOUNT
            Write-Host "resolver answered $($resp.Length) bytes, ANCOUNT=$ans"
            if ($resp.Length -ge 12 -and $ans -ge 1) {
              $ip = "$($resp[-4]).$($resp[-3]).$($resp[-2]).$($resp[-1])"
              Write-Host "last A record = $ip"
              if ($ip -ne "127.0.0.9") { throw ".test override did not resolve to 127.0.0.9 (got $ip)" }
              Write-Host "OK: adi-dns.exe resolved foo.test -> 127.0.0.9 on Windows."
            } else { throw "resolver returned no answer" }
          } catch {
            Write-Host "--- adi-dns stdout ---"; Get-Content dns-out.log -ErrorAction SilentlyContinue
            Write-Host "--- adi-dns stderr ---"; Get-Content dns-err.log -ErrorAction SilentlyContinue
            throw
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      # Best-effort: full service lifecycle through Task Scheduler. Bounded by a 90s timeout so a
      # non-interactive UAC on the DNS route step can't hang the job; informational only.
      - name: Service lifecycle via Task Scheduler (best-effort)
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = (Resolve-Path "target\release\adi-mono.exe").Path
          $job = Start-Job -ArgumentList $exe -ScriptBlock {
            param($e)
            Write-Output "--- up ---";      & $e up      2>&1
            Write-Output "--- status ---";  & $e status  2>&1
            Write-Output "--- disable ---"; & $e disable  2>&1
          }
          if (Wait-Job $job -Timeout 90) {
            Receive-Job $job
            Write-Host "lifecycle completed"
          } else {
            Stop-Job $job
            Write-Host "lifecycle timed out at 90s (likely the elevated DNS-route step in a non-interactive session); this is expected on CI."
          }

      # ── the installer, on real Windows ──────────────────────────────────────────────────────
      #
      # The release build cross-compiles the installer from Linux, where nothing can run it. An
      # installer that compiles is not an installer that works: what breaks is the PATH edit, a
      # shortcut path, a registry key, an uninstall that leaves the folder behind — none of which
      # is visible until someone runs it. So it is built and *exercised* here, against the MSVC
      # binaries this job already produced, and then undone again.
      #
      # Last in the job on purpose: the uninstall runs `adi-mono disable`, which unregisters this
      # user's scheduled tasks, and the lifecycle step above wants its own.
      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build and exercise the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"

          # The package layout apps/windows/build.sh assembles, staged here from the MSVC build.
          # Kept in step with that script by the assertion below: every file the installer expects
          # has to be present, or makensis fails outright.
          $stage = "$env:RUNNER_TEMP\pkg"
          New-Item -ItemType Directory -Force -Path "$stage\bin" | Out-Null
          foreach ($b in 'adi-mono', 'adi-dns', 'adi-hive', 'adi-app') {
            Copy-Item "target\release\$b.exe" "$stage\bin\$b.exe"
          }
          Copy-Item "target\release\adi-launcher.exe" "$stage\bin\ADI.exe"
          Copy-Item "apps\windows\ADI.ico" "$stage\bin\ADI.ico"
          '@echo off'                     | Set-Content "$stage\bin\adi.cmd"
          '"%~dp0adi-mono.exe" %*'        | Add-Content "$stage\bin\adi.cmd"
          '9.9.9'                         | Set-Content "$stage\VERSION"
          Copy-Item "apps\windows\README.md" "$stage\README.txt"
          Copy-Item "LICENSE" "$stage\LICENSE.txt"

          $setup = "$env:RUNNER_TEMP\ADI-Setup-x64.exe"
          & $makensis /V2 /DVERSION=9.9.9 /DVERSION_QUAD=9.9.9.0 `
            "/DSOURCE_DIR=$stage" "/DOUTFILE=$setup" "apps\windows\installer\adi.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis exited $LASTEXITCODE" }
          Write-Host "installer built: $((Get-Item $setup).Length) bytes"

          # /S is a silent install. The .adi route step and the finish page (which would launch
          # the tray app) are both skipped for a silent install by design — there is nobody here
          # to answer a UAC prompt or look at a tray icon.
          $install = "$env:LOCALAPPDATA\Programs\ADI"
          Start-Process -Wait -FilePath $setup -ArgumentList '/S'

          foreach ($f in 'bin\ADI.exe', 'bin\adi-mono.exe', 'bin\adi-dns.exe', 'bin\adi-hive.exe',
                         'bin\adi-app.exe', 'bin\adi.cmd', 'bin\VERSION', 'README.txt', 'VERSION',
                         'Uninstall ADI.exe') {
            if (-not (Test-Path "$install\$f")) { throw "the install is missing $f" }
          }
          # Nothing loose in the root but documents and the uninstaller: no person should have to
          # choose between four .exe files, and that is the whole reason this installer exists.
          $loose = Get-ChildItem $install -File -Filter *.exe | Where-Object { $_.Name -ne 'Uninstall ADI.exe' }
          if ($loose) { throw "the install root has stray executables: $($loose.Name -join ', ')" }
          Write-Host "installed layout OK"

          # The installed CLI runs, and it is the one we just built.
          & "$install\bin\adi-mono.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the installed adi-mono --help exited $LASTEXITCODE" }

          # PATH, read raw: path.ps1 must not have expanded anyone else's variables while adding
          # ours, so assert both that ours is there and that a %VAR% written by someone else
          # survives. (There need not be one; this only checks we did not create the damage.)
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $raw = $key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          if (($raw -split ';') -notcontains "$install\bin") { throw "PATH is missing $install\bin (raw: $raw)" }
          Write-Host "PATH OK"

          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\ADI.lnk"
          if (-not (Test-Path $shortcut)) { throw "no Start-menu shortcut" }

          $uninstKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\ADI'
          $entry = Get-ItemProperty $uninstKey
          if ($entry.DisplayVersion -ne '9.9.9') { throw "Installed apps shows '$($entry.DisplayVersion)'" }
          Write-Host "Add/Remove Programs entry OK"

          # An NSIS uninstaller copies itself to %TEMP% and runs from there — which is what lets
          # it delete its own folder, and why the process we started returns long before the work
          # is done. Wait for the folder to actually go.
          Start-Process -Wait -FilePath "$install\Uninstall ADI.exe" -ArgumentList '/S'
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $install) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $install) { throw "the uninstaller left $install behind" }

          $raw = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment').GetValue(
            'Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          if (($raw -split ';') -contains "$install\bin") { throw "the uninstaller left ADI on PATH" }
          if (Test-Path $shortcut) { throw "the uninstaller left the Start-menu shortcut" }
          if (Test-Path $uninstKey) { throw "the uninstaller left its Installed apps entry" }
          Write-Host "OK: installed, verified and uninstalled cleanly on real Windows."
