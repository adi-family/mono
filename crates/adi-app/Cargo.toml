[package]
name = "adi-app"
description = "The adi app: a Rust HTTP backend serving a control-panel SPA at / and a JSON API at /api, fronted by adi-hive at app.adi."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "adi-app"
path = "src/main.rs"

[dependencies]
# The /api contract + server handlers; the `server` feature pulls in the port registry.
adi-osext = { workspace = true, features = ["signals"] }
adi-webapp-api = { workspace = true, features = ["server"] }

adi-ports-manager = { workspace = true }

adi-projects = { workspace = true }

adi-secrets = { workspace = true }

adi-db = { workspace = true }

adi-tasks = { workspace = true }

adi-tools = { workspace = true }

adi-agents = { workspace = true }

# The knowledge base, with its default features — which is what turns the embedder on for this
# binary. Deliberate, and the one place the panel pays for it: `adi-core` takes this crate
# without default features precisely so nothing else has to, but a Knowledge page that could not
# rank by meaning would be a list, not a search. Loading is lazy, so the cost is paid on the
# first search and not at start-up.
adi-knowledge = { workspace = true }

adi-triggers = { workspace = true }

adi-events = { workspace = true }

adi-mesh = { workspace = true }

adi-css = { workspace = true }

# The webapp's Trunk build output (`crates/adi-webapp/dist`), embedded at compile time so
# the binary is self-contained — no runtime asset paths.
include_dir = "0.7"

tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "signal", "time", "io-util", "fs", "sync"] }

# Server-side OAuth-secret refresh: adi-app calls the OAuth router's /refresh/<provider> so
# the refresh token never reaches the browser. rustls to avoid a system OpenSSL dependency.
reqwest = { workspace = true }
# reqwest is built with `rustls-no-provider` (see the workspace manifest), so no crypto provider
# is chosen for us; the ring provider is installed once at start-up in main.
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The websocket handshake's `Sec-WebSocket-Accept` (see src/ws.rs).
base64 = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# The await worker's test points a real `Agents`/`Awaits` pair at a scratch store root, which is
# the one place this crate names the config layer directly.
adi-config = { workspace = true }

[lints]
workspace = true
