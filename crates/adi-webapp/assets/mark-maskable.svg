<!-- The adi mark for a maskable slot: the same paper tile bled to the edges, with the mark
     pulled in so it survives whatever shape a launcher crops to. Flat and coloured, as mark.svg.

     A maskable icon may lose everything outside the centre circle of 80% diameter. The mark
     spans 56% of the canvas and its furthest corner sits 25% from the centre, so it clears that
     with room to spare. Generated the same way as mark.svg — see its header. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="adi">
  <title>adi</title>
  <defs>
    <mask id="adi-mark-cut-0" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <rect width="200" height="200" fill="#fff"/>
      <path fill="#000" d="M127.71 65.00 L178.81 94.50 L178.81 153.50 L127.71 183.00 L76.62 153.50 L76.62 94.50 Z"/>
      <path fill="#000" d="M100.00 17.00 L151.10 46.50 L151.10 105.50 L100.00 135.00 L48.90 105.50 L48.90 46.50 Z"/>
    </mask>
    <mask id="adi-mark-cut-1" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <rect width="200" height="200" fill="#fff"/>
      <path fill="#000" d="M100.00 17.00 L151.10 46.50 L151.10 105.50 L100.00 135.00 L48.90 105.50 L48.90 46.50 Z"/>
    </mask>
  </defs>
  <rect width="1024" height="1024" fill="#FBFAF8"/>
  <!-- Smaller than mark.svg: a launcher may crop everything outside the centre 80%. -->
  <g transform="translate(225.28 225.28) scale(2.8672)" style="color:#14181d">
    <g class="adi-mark__lobes">
      <g class="adi-mark__lobe adi-mark__lobe--back" mask="url(#adi-mark-cut-0)">
        <path fill="#8C8780" d="M72.29 68.00 L120.78 96.00 L120.78 152.00 L72.29 180.00 L23.79 152.00 L23.79 96.00 Z"/>
      </g>
      <g class="adi-mark__lobe adi-mark__lobe--mid" mask="url(#adi-mark-cut-1)">
        <path fill="#E8532A" d="M127.71 68.00 L176.21 96.00 L176.21 152.00 L127.71 180.00 L79.22 152.00 L79.22 96.00 Z"/>
      </g>
      <g class="adi-mark__lobe adi-mark__lobe--front">
        <path fill="currentColor" d="M100.00 20.00 L148.50 48.00 L148.50 104.00 L100.00 132.00 L51.50 104.00 L51.50 48.00 Z"/>
      </g>
    </g>
  </g>
</svg>
