<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>adi · control panel</title>

<!-- Installable-app metadata. The app is dark (design/DESIGN.md §3); the theme colour is the
     `--bg-side` token, so the window chrome is continuous with the bars. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#101010">
<meta name="color-scheme" content="dark">
<meta name="application-name" content="adi">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS installs from Share → "Add to Home Screen"; these are the knobs it reads. The
     `apple-` capable flag is deprecated in favour of the standard one above, but older iOS
     still only understands this spelling. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="adi">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" href="/assets/favicon.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/icon-192.png" sizes="192x192" type="image/png">
<!-- Last, so it wins wherever it is understood: a browser takes the final `rel="icon"` it
     can read, and the PNGs above stay the answer for the ones that cannot. -->
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">


<link data-trunk rel="rust" />
<!-- adi-ui first, adi-css second. Both resolve to design/tokens.css, so the order only decides
     which reset wins where they overlap; see styles/tailwind.css. -->
<link data-trunk rel="tailwind-css" href="styles/tailwind.css" />
<link data-trunk rel="scss" href="styles/main.scss" />
<!-- adi-ui's @font-face rules resolve against the dist root, so the files have to land there. -->
<link data-trunk rel="copy-dir" href="../adi-ui/fonts" />
<!-- Copied verbatim (no content hash) so the manifest, the worker and the icons keep the
     stable URLs the browser and the manifest above expect. -->
<link data-trunk rel="copy-file" href="manifest.webmanifest" />
<link data-trunk rel="copy-file" href="sw.js" />
<link data-trunk rel="copy-dir" href="assets" />

<script>
// PWA bootstrap. Two jobs, both of which have to happen outside the wasm bundle:
//
//   1. Register the service worker (sw.js) — the install criteria require one.
//   2. Catch `beforeinstallprompt`. It fires once, early, and the saved event is the *only*
//      way to open the install dialog later; it can't be re-created on demand. So park it
//      here and expose it as `window.__adiPwa` for the Rust side to drive from a button.
//
// Both need a secure context: HTTPS, or a loopback origin like http://localhost:8000. Over
// plain http://app.adi the browser withholds `serviceWorker` entirely and never fires the
// install event — so the flags below stay false and the in-app install button stays hidden.
(function () {
  var deferred = null;
  var pwa = {
    // Whether the browser has offered us an install prompt to open.
    canInstall: false,
    // Already launched as an installed app — nothing left to offer.
    standalone: window.matchMedia("(display-mode: standalone)").matches
      || window.navigator.standalone === true,
    // Set by the wasm app; called whenever the flags above change.
    onchange: null,
  };
  window.__adiPwa = pwa;

  function changed() {
    try {
      if (typeof pwa.onchange === "function") pwa.onchange();
    } catch (e) {
      console.warn("adi: pwa onchange handler failed", e);
    }
  }

  window.addEventListener("beforeinstallprompt", function (event) {
    // Suppress the browser's own mini-infobar; the app's own button drives it instead.
    event.preventDefault();
    deferred = event;
    pwa.canInstall = true;
    changed();
  });

  window.addEventListener("appinstalled", function () {
    deferred = null;
    pwa.canInstall = false;
    changed();
  });

  // Called from the app's install button. Resolves once the user accepts or dismisses.
  pwa.install = function () {
    if (!deferred) return Promise.resolve(false);
    var event = deferred;
    return Promise.resolve(event.prompt())
      .then(function () { return event.userChoice; })
      .then(function (choice) {
        var accepted = choice && choice.outcome === "accepted";
        if (accepted) {
          // The event is single-use, and Chrome won't fire another one.
          deferred = null;
          pwa.canInstall = false;
          changed();
        }
        return accepted;
      })
      .catch(function (e) {
        console.warn("adi: install prompt failed", e);
        return false;
      });
  };

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(function (e) {
        console.warn("adi: service worker registration failed", e);
      });
    });
  }
})();
</script>
</head>
<body>
<!-- The first frame, before a byte of wasm has run: the mark and the wordmark, centred, in the
     page's own theme. `drop_boot_splash()` removes this node once the app mounts, and the app
     keeps showing the same splash (`.adi-boot`) until /api/meta says whether to onboard or chat.

     The mark is written out here because there is no wasm yet to draw it, and drawn by
     `Mark` in adi-ui on the other side of the handover. `every_copy_of_the_mark_agrees` in
     src/pwa.rs fails if the two ever stop being the same mark. This is the solid build: above
     ~64px the lobes no longer need hairline gaps to stay apart, and the splash is never
     smaller than 72. Monochrome and flat, as design/DESIGN.md §10 says every copy is. -->
<div id="adi-boot" class="adi-boot">
  <svg class="adi-boot__mark" viewBox="0 0 200 200" fill="none" aria-hidden="true">
    <g class="adi-mark__lobes">
      <path fill="currentColor" fill-opacity="0.52" d="M72.29 68.00 L120.78 96.00 L120.78 152.00 L72.29 180.00 L23.79 152.00 L23.79 96.00 Z"/>
      <path fill="currentColor" fill-opacity="0.74" d="M127.71 68.00 L176.21 96.00 L176.21 152.00 L127.71 180.00 L79.22 152.00 L79.22 96.00 Z"/>
      <path fill="currentColor" d="M100.00 20.00 L148.50 48.00 L148.50 104.00 L100.00 132.00 L51.50 104.00 L51.50 48.00 Z"/>
    </g>
  </svg>
  <span class="adi-boot__logo">adi</span>
</div>
</body>
</html>
