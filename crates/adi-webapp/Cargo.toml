[package]
name = "adi-webapp"
description = "The adi control-panel UI: a Leptos (Rust→wasm) single-page app, built by Trunk and embedded into adi-app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# The shared /api wire types. Without the `server` feature it stays wasm-safe — no
# adi-ports-manager, no filesystem I/O reaches this crate.
adi-webapp-api = { workspace = true }

# The component library. It brings its own tokens and its own utilities; see
# `styles/tailwind.css` for how the two design systems share one page.
adi-config = { workspace = true }
adi-ui = { workspace = true }

leptos = { version = "0.8", features = ["csr"] }

# Browser plumbing: fetch (gloo-net), interval timers (gloo-timers), panics routed to the
# console, spawn_local for async in event handlers, and the web APIs the theme toggle uses.
gloo-net = { version = "0.6", features = ["json"] }
gloo-timers = "0.3"
wasm-bindgen = "0.2"
# Percent-encoding for the /files/<path> route (encodeURIComponent / decodeURIComponent).
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "Storage",
    "DomRect",             # the engine menu is placed by measuring its button (see `voice`)
    "MediaQueryList",
    "Location",
    "History",           # push/replaceState for client-side routing
    "EventTarget",       # popstate listener (back/forward)
    "MouseEvent",        # nav-link click handling, right-click menus on the store tree
    "KeyboardEvent",     # Enter/Escape on the store tree's new-entry input
    "FocusEvent",        # select-all on focus for the copyable id/ticket fields
    "HtmlElement",       # focus() the copyable field before copying
    "HtmlInputElement",  # select() the id/ticket text for the Copy button
    "HtmlTextAreaElement", # scrollHeight/value: the chat composers grow with the message typed
    "CssStyleDeclaration", # …by writing that measured height back as an inline style
    "UrlSearchParams",   # parse the OAuth token returned in the redirect URL fragment
    # Dictation (see `voice`): open the microphone, record a clip, and hand its bytes to
    # /api/voice/transcribe. `SpeechRecognition` is absent from this list on purpose — web-sys
    # has it only behind `web_sys_unstable_apis`, and `voice` reaches it through Reflect instead.
    "Navigator",
    "MediaDevices",
    "MediaStream",
    "MediaStreamTrack",       # …released explicitly, or the recording indicator stays lit.
    "MediaStreamConstraints",
    "MediaRecorder",
    "MediaRecorderOptions",
    "BlobEvent",              # …its chunks…
    "Blob",
    "BlobPropertyBag",        # …joined into one clip carrying the recorder's own MIME type.
    # The live channel (see `live`): one socket per tab, in place of a poll per open view.
    "WebSocket",
    "MessageEvent",      # …its inbound messages…
    "CloseEvent",        # …and the close that triggers a reconnect.
] }

serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
