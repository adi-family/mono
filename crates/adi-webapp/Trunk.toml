# Trunk build settings for the adi webapp. The `dist/` output is embedded into adi-app,
# which serves it at app.adi — that is the production path.
[build]
target = "index.html"
dist = "dist"

# Watch the webapp, the shared design system AND the token file, so editing any of them
# hot-reloads too.
#
# The two Rust crates the panel is *made of* are watched for the same reason their stylesheets
# are: a component lives in `adi-ui` and the wire types live in `adi-webapp-api`, so most days
# a change to the panel is a change to one of them. Without them here `trunk serve` sits still
# after an edit and `devui wait` reports the previous build — which reads as "it compiled" and
# is really "nothing happened", and the panel then serves a wasm bundle older than the source.
[watch]
watch = [
    ".",
    "../adi-ui/src",
    "../adi-ui/styles",
    "../adi-webapp-api/src",
    "../adi-css/scss",
    "../../design",
]
ignore = ["dist"]

# `trunk serve` is only for standalone UI iteration. It proxies /api to the adi-app that
# `scripts/dev.sh` starts on :8090 against the isolated ADI_DIR=.adi-dev registry — NOT the
# live control panel on :8000, which runs the installed binary and whatever state is real.
[tools]
# Pin Tailwind v4 — Trunk's default is 3.3.5, which cannot parse a v4 stylesheet. Same pin
# as crates/adi-ui/Trunk.toml, for the same reason.
tailwindcss = "4.2.1"

[serve]
addresses = ["127.0.0.1"]
port = 9080
# Revalidate everything, every load. Trunk sends `Last-Modified` and no `Cache-Control`, which lets
# a browser reuse a file it holds without asking — harmless for the hashed wasm and CSS, but the
# element files (`/elements/*.js`, copied unhashed) are an ES module graph, and a stale
# `adi-elements.js` over a new tree registers none of the new tags: `<adi-chat>` drew as nothing.
headers = { "cache-control" = "no-cache" }

[[proxy]]
rewrite = "/api/"
backend = "http://127.0.0.1:8090/api/"
