[package]
name = "adi-db"
description = "The shared SQLite store for the adi platform: one WAL database per scope (global at ~/.adi/mono/db/global.db, plus one per project), opened with the same pragmas by every process — the CLI, the app, agents' tools, and Bun via the seeded @adi/db client. Pure library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
adi-config = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

# SQLite itself, compiled in (`bundled`) rather than linked against a system library, so every
# target — including the mingw Windows cross-build — ships the same engine and version.
rusqlite = { workspace = true }

# BLOB columns are surfaced to JSON/CLI callers as base64 strings; nothing else needs it.
base64 = { workspace = true }

[lints]
workspace = true
