[package]
name = "adi-dns"
description = "adi-family local DNS resolver: split-DNS overrides + upstream forwarding, run in the foreground under a supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
adi-osext = { workspace = true, features = ["signals"] }
hickory-server = { version = "0.26", features = ["resolver"] }
hickory-resolver = "0.26"
hickory-proto = "0.26"

tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "signal", "time"] }
async-trait = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
