[package]
name = "adi-agents"
description = "Agent definitions and run adapters for the adi platform: reusable executor:engine manifests under ~/.adi/mono/agents, interactive tmux Claude/Codex sessions, and detached headless process Claude/Codex runs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
adi-config = { workspace = true }
# Cross-platform process/fs primitives (detach a spawned child's process group on Unix/Windows).
adi-osext = { workspace = true }
# Agent lifecycle changes (run started, saved, deleted, stopped) publish `adi.agents.*` events
# onto the shared bus for event triggers to react to; this crate never learns who subscribes.
adi-events = { workspace = true }
# An agent materializes its own `.bin` of enabled tools onto its PATH at launch.
adi-tools = { workspace = true }
# Interactive agent sessions run under an in-process pty (the cross-platform replacement for the
# external tmux server) driven through this session manager.
adi-pty = { workspace = true }
# Not used at runtime: this crate assembles the *whole* platform event catalog (task events +
# agent events) in `event_catalog`, so it needs the `adi.tasks.*` payload types + `event_types`.
# It is the lowest crate that can see every producer's payload type (adi-events sits below both).
adi-tasks = { workspace = true }
# The first thing in this crate that logs, and deliberately: every other best-effort path here
# swallows its failure with `.ok()`, which is fine when what is lost is a nicety. A memory the
# operator switched on and that could not be created is not a nicety — the agent would run
# without the thing its definition says it has, and nobody would be told. Already in the
# workspace graph, so it costs nothing to build.
tracing = { workspace = true }
# An image attached to a message is stored as bytes and sent to a model provider as base64 — all
# four providers the adi loop speaks take it that way, and three of them inside a data: URL.
base64 = { workspace = true }

# An agent's memory and its readable bases, made real at launch (see src/knowledge.rs). A path
# dependency with `default-features = false`: the runner creates a base and resolves ids, it never
# embeds — so nothing here needs the embedding model, and the agent reaches search through the
# `adi-knowledge` CLI like every other capability.
adi-knowledge = { path = "../adi-knowledge", default-features = false }
# A run inherits its agent's resolved secrets (global + the agent's project) as env vars.
adi-secrets = { workspace = true }
# The `harness:adi` tool loop's Grep runs a real regular expression, and its Glob/Grep walk a tree.
regex = { workspace = true }
# Sessions, turns, and queued messages live in `<sessions>/sessions.db` rather than in a file per
# session: the listing walked directories, and a profile of it under load put 5255 samples in
# `stat` against 112 in JSON parsing. Bundled, so no system SQLite is required.
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# A Codex thread is local to its CLI state directory and login. Persist only a digest of that
# context beside the thread id, never an API key/token itself, so a later turn cannot accidentally
# resume one account's conversation under another.
sha2 = { workspace = true }
# Read Codex's layered config so provider auth, state paths, and managed policy are bound to the
# thread. Raw config and secrets never leave the process; only the resulting digest is persisted.
toml = { workspace = true }
# Match Codex's RFC 3339 `last_refresh` parsing when deciding whether its OAuth manager will
# refresh before cloud-policy selection. Parsing only; wall-clock arithmetic stays in `std`.
time = { version = "0.3", default-features = false, features = ["parsing"] }
# A harness conversation mints a fresh session id (v4 UUID) for the Claude CLI to establish on the
# first turn and resume on every reply.
uuid = { workspace = true }
# The `harness:adi` loop calls a model provider's chat API over HTTP. Blocking client: each turn runs
# in a spawned `adi-mono harness-turn` child (a sync process), never inside the app server's runtime.
reqwest = { workspace = true, features = ["blocking"] }
# reqwest is built with `rustls-no-provider` (see the workspace manifest), so no crypto provider
# is chosen for us; `ensure_provider` installs ring before the first client is built.
rustls = { workspace = true }
# `adi.agents.*` payloads derive their JSON Schema; this crate also assembles the full event
# catalog (task events + agent events), the lowest crate that can see every producer's type.
schemars = { workspace = true }
# Transcript analytics counts context in tokens, not characters — see `analytics`.
tiktoken-rs = { workspace = true }
# A "the model gave us nothing" bug report names the build it happened on, the same convention
# `adi-core::VERSION` re-exports for the CLI's own `--version`.
adi-update = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Codex reads MDM-delivered config through CFPreferences. Thread reuse fingerprints those same
# values so an administrator changing auth/provider policy cannot cross-resume an old thread.
core-foundation = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Match `dirs::home_dir()` under the exact environment handed to Codex, including passwd fallback
# when an agent explicitly empties HOME.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Codex resolves the Windows profile and ProgramData roots through Known Folders, not inherited
# HOME/USERPROFILE/PROGRAMDATA variables. Use the same API when binding a thread to its CLI state.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[lints]
workspace = true
