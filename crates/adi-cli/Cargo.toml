[package]
name = "adi-cli"
description = "The adi platform CLI — a thin argv adapter over adi-core's command surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The produced binary name. This is the single source of truth for the eventual
# rename to `adi` — change it here (and the matching constant in the Swift app).
[[bin]]
name = "adi-mono"
path = "src/main.rs"

[dependencies]
adi-config = { workspace = true }
adi-core = { workspace = true }

# The `mesh` command group (docs/fleet.md E3). This is what pulls iroh into `adi-mono`, and it is
# a deliberate trade: a node is enrolled over ssh or cloud-init, where there is no control panel
# and often no second binary, so pairing has to be reachable from a shell on the box itself. The
# escape hatch, if the binary size ever matters more than that, is a Cargo feature — not a second
# CLI, which would only move the same code behind a name nobody has on the node.
adi-mesh = { workspace = true }

# The `indexer` command group. This is what pulls tree-sitter and the candle embedding stack into
# `adi-mono` — a deliberate trade, the same one `mesh` makes: the index is what an agent reaches
# for to find code, and an agent has this binary and nothing else. To shed the weight, build
# adi-indexer with `--no-default-features` (see its Cargo.toml) rather than splitting the CLI.
adi-indexer = { workspace = true }

# The `knowledge` command group. Default features on, which turns the embedder back on for this
# binary: adi-core deliberately takes adi-knowledge without it (see its Cargo.toml), and cargo
# unifies features per build — so `adi-mono` embeds notes while `adi-app`, which links the same
# facade, carries none of the model stack.
adi-knowledge = { workspace = true }

# The `facts` command group. Unlike the two above it pulls in no model stack at all: it embeds
# and classifies over HTTP against a local ollama, because that is the model every threshold in
# its design was measured against.
adi-facts = { workspace = true }

# The `marketplace` command group: sources, sync, install, start. This is what pulls the HTTPS
# fetch (blocking reqwest + rustls) into `adi-mono` — the same trade `mesh` makes for iroh: an
# app a reader installs from a manifest is reachable from a shell, wherever that shell is.
adi-marketplace = { workspace = true }

clap = { workspace = true }
# `mesh invite` draws its token as a QR (see `src/qr.rs`). Encoder only — the decoder is the
# browser client's problem, and this binary never reads an image.
qrcode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# `mesh join` dials out and awaits one handshake; every other subcommand is synchronous. So the
# runtime is built inside that one arm rather than wrapping `main`, and only the drivers that
# handshake needs are compiled in.
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time"] }

[dev-dependencies]
# A QR nobody scanned is an untested feature. `src/qr.rs`'s test reads the exact characters this
# command prints back into a bitmap and decodes them — with the same decoder the browser client
# points its camera through, so both halves of the pairing flow are checked against one reader.
quircs = { workspace = true }

[lints]
workspace = true
