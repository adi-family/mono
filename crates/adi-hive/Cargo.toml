[package]
name = "adi-hive"
description = "adi-family reverse proxy: routes inbound HTTP by Host header to a local upstream (nginx-style), run in the foreground under a supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# The routing brain is a library so the mesh gateway can reuse the config loader and the route
# table rather than reimplement them (docs/fleet.md A1); the binary is the daemon around it.
[lib]
name = "adi_hive"
path = "src/lib.rs"

[[bin]]
name = "adi-hive"
path = "src/main.rs"

[dependencies]
adi-config = { workspace = true }
adi-osext = { workspace = true, features = ["signals"] }

# Allocate a stable port for any proxied/runner service that doesn't declare one, so
# ports come from the platform's registry instead of being hand-picked in hive.yaml.
adi-ports-manager = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "signal", "time", "io-util", "process", "sync"] }

# HTTPS on the front door. `ring` rather than the default aws-lc-rs provider: no cmake, no C
# toolchain, so the build stays as portable as the rest of the workspace. rcgen mints the local
# CA and leaf itself, so a fresh machine needs no openssl/mkcert installed to get TLS.
rustls = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { workspace = true }
# `rcgen` states certificate validity as a `time::OffsetDateTime`, so we need the same crate to
# say "one year from now" — its own default is 1975→4096, which Apple rejects outright.
time = { version = "0.3", default-features = false, features = ["std"] }

# The single config is a hive.yaml (nakit-yok format); serde_yaml_ng is the
# maintained fork of the archived serde_yaml.
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
