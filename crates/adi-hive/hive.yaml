# hive.yaml — the single adi-hive config.
#
# Canonical location:  ~/.adi/mono/hive/hive.yaml  (honoring $ADI_DIR)
# Override for testing: adi-hive /path/to/hive.yaml
#
# This is the nakit-yok hive spec format. adi-hive reads the proxy slice —
# `proxy.bind`, and per service its `proxy.host` + HTTP port
# (`rollout.recreate.ports.http`) — and the run slice: `runner.script` (`run` +
# `working_dir`), `environment.static`, and `restart`. It launches each service's
# runner (injecting its port as `$PORT`/`PORT_<KEY>`) and supervises it, restarting
# per `restart`. Other fields (healthcheck, depends_on, …) are accepted-but-ignored.
#
# adi-hive pairs with adi-dns: adi-dns resolves *.adi to 127.0.0.53 (the front-door
# address below), then adi-hive fans those hostnames out to the per-service HTTP
# ports it keeps alive. A Host that matches no service gets an animated 4XX page.

version: "1"

proxy:
  bind:
    # The front door. adi-dns answers *.adi -> 127.0.0.53, so all .adi HTTP arrives
    # here. Binding 127.0.0.53:80 needs root (and, on macOS, aliasing it onto lo0,
    # which adi-hive does); a bind failure is non-fatal, so it keeps serving whatever
    # else bound.
    - "127.0.0.53:80"
    # Unprivileged dev fallback — always bindable without root.
    - "127.0.0.1:8080"
  # HTTPS, terminated here with a certificate adi-hive mints itself (see `src/tls.rs`): a local CA
  # in `./tls/ca.pem` plus a leaf covering every routed host. Trust that CA once and
  # `https://app.adi` becomes a *secure context* — which is what a service worker requires, and so
  # what lets the control panel install as an app. Additive: the plain binds above keep serving, so
  # nothing that speaks HTTP to the front door breaks. Omit the key entirely for no HTTPS.
  tls_bind:
    - "127.0.0.53:443"
  # The local mesh gateway. Set it and every host ending in `.n.adi` — the reserved namespace for
  # *remote* adi machines, `<service>.<node>.n.adi` — is forwarded here verbatim instead of being
  # matched against the services below. One rule covers the whole fleet: the gateway is what turns
  # a hostname into a peer key, and adi-hive deliberately learns none of that. Omit it and such a
  # host gets a "node unreachable" page rather than a misleading 404.
  # 10080 is the platform default (adi-config's MESH_GATEWAY_PORT, which adi-mesh binds and
  # adi-core writes into the generated front door). Deliberately outside the ports manager's
  # 8000-9999 range, so the allocator can never hand a project the gateway's port.
  mesh_gateway: "127.0.0.1:10080"
  # Petnames of the nodes you have paired with. Only TLS reads this: a wildcard label covers one
  # level, so `*.n.adi` reaches `laptop-b.n.adi` but not `nosh.laptop-b.n.adi`, and the leaf needs
  # a `*.<node>.n.adi` per node. Pairing appends the name here; the next start mints a leaf for it.
  mesh_nodes:
    - laptop-b

services:
  # A proxied service: Host: app.adi -> 127.0.0.1:8010
  frontend:
    proxy:
      host: app.adi
      path: /
    rollout:
      type: recreate
      recreate:
        ports:
          http: 8010
    runner:
      type: script
      script:
        run: bun run dev
        working_dir: frontend
    healthcheck:
      type: tcp
      tcp:
        port: "{{runtime.port.http}}"

  # Host: api.adi -> 127.0.0.1:8009
  backend:
    proxy:
      host: api.adi
      path: /
    rollout:
      type: recreate
      recreate:
        ports:
          http: 8009
    runner:
      type: script
      script:
        run: npm run start:dev
        working_dir: backend

  # One origin, two services. The dashboard's page owns `nosh.adi`; its backend claims `/api` on
  # the same host, so the page only ever uses relative URLs and never has to learn its own address
  # — which is what lets it work unchanged under `nosh.adi`, `nosh.laptop-b.n.adi` over the mesh,
  # or a real customer domain. Longest prefix wins, so `/api/things` is the backend's and
  # `/apifoo` (no segment boundary) is not.
  nosh-frontend:
    proxy:
      host: nosh.adi
    rollout:
      recreate:
        ports:
          http: 8020
  nosh-backend:
    proxy:
      host: nosh.adi
      path: /api
    rollout:
      recreate:
        ports:
          http: 8021

  # No `proxy:` — not fronted by adi-hive, silently ignored.
  postgres:
    rollout:
      type: recreate
      recreate:
        ports:
          db: 8045
