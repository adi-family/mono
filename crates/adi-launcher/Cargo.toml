[package]
name = "adi-launcher"
description = "ADI.exe — the Windows launcher: the one thing a person opens. A tray app that brings the stack up, watches it, and opens the control panel. The counterpart of ADI.app on macOS, which holds the same binaries out of sight and does the same three things."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Installed as `ADI.exe` (apps/windows/build.sh renames it): the app's name is what the person
# sees in the Start menu, and `adi-launcher.exe` is a build artifact's name, not a product's.
# Kept lowercase here so the crate, the package and the binary agree everywhere else.
[[bin]]
name = "adi-launcher"
path = "src/main.rs"

[dependencies]
# `status --json` is the whole state model — the same contract the macOS app decodes (see
# apps/macos/Sources/Models.swift). Nothing is derived here that adi-core does not already say.
serde = { workspace = true }
serde_json = { workspace = true }

# The tray icon, the menu and the message loop, straight from Win32. No GUI framework: this
# window is never shown, and everything the person looks at is either the tray or the control
# panel in their browser.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # `CreateMutexW` takes SECURITY_ATTRIBUTES, which lives here — the single-instance mutex is
    # the only reason this feature is on.
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
