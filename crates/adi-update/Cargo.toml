[package]
name = "adi-update"
description = "Auto-update engine for the adi platform: fetch the release manifest, download and verify the DMG, and atomically swap the installed app bundle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
adi-config = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
# The artifact's checksum, computed in-process. The only dependency here, and it buys the one
# thing shelling out cannot: a checksum on every platform. No OS ships a hashing tool the other
# two also have — see `engine::sha256`.
sha2 = { workspace = true }

[lints]
workspace = true
