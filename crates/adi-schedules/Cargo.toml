[package]
name = "adi-schedules"
description = "The WORKFLOWS schedule sweep (ADI-MONO-141 §D): computes which slots a workflow's cron rule owes since it was last checked, in the workflow's own IANA timezone with DST handled, collapses a downtime backlog to a single fire (or none, under `catchUp: skip`), and claims each `wf@slot` run key exactly once. Pure library — the workflow engine (WF-5) supplies the schedules and what a pour actually does."
