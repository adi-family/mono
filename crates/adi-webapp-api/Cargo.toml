[package]
name = "adi-webapp-api"
description = "The wire contract and server handlers for the adi webapp: serde DTO types (compiled everywhere, incl. wasm) plus the /api/* logic over adi-ports-manager behind the `server` feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# The native-only server side: the /api handlers over the live port registry and mesh
# config. The wasm frontend depends on this crate WITHOUT this feature, so it pulls in only
# the DTO types (never adi-ports-manager or adi-mesh, which do filesystem I/O / link iroh
# and can't target wasm).
server = [
    "dep:adi-config",
    "dep:adi-osext",
    "dep:adi-ports-manager",
    "dep:adi-mesh",
    "dep:adi-projects",
    "dep:adi-secrets",
    # The shared SQLite store. Native-only (it compiles SQLite in), which is exactly why it
    # sits behind this feature and never reaches the wasm frontend.
    "dep:adi-db",
    "dep:adi-tasks",
    "dep:adi-tools",
    "dep:adi-agents",
    # The knowledge base. Native-only (it compiles SQLite in and, with its default features, the
    # embedding model), which is exactly why it sits behind this feature and never reaches wasm.
    "dep:adi-knowledge",
    "dep:adi-triggers",
    # The auto-update engine, for the version pill's `/api/update` surface: what is installed,
    # what is published, and the marker that says an install is in flight. Native-only (it swaps
    # binaries and shells out to the platform's own tools), so it lives behind this feature.
    "dep:adi-update",
    # Background triggers are supervised in-process by the app, so the handlers can poke the
    # supervisor when a save changes what should be running.
    "adi-triggers/supervisor",
    # The event-emit endpoint publishes onto the shared event bus.
    "dep:adi-events",
    "dep:adi-fs",
    "dep:adi-hooks",
    # A dashboard travels between machines as base64 file bytes (`DashboardBundle`), so that a
    # transfer carries an icon or a fixture as faithfully as it carries a `.ts` file.
    "dep:base64",
    "dep:serde_yaml_ng",
    "dep:toml",
    "dep:uuid",
    # Dictation (`handlers::voice`) posts the recorded clip to a speech-to-text provider, so the
    # API key stays on this side and never reaches the page.
    "dep:reqwest",
    "dep:rustls",
    # Pairing mints an invite here and answers with it drawn as a QR, so the encoder is a server
    # dependency and the page stays a `<svg>` it inlines.
    "dep:qrcode",
]

[dependencies]
serde = { workspace = true }

# The on-disk dashboard contract: manifest, hive file, and the bundle a dashboard travels as.
# Non-optional (not behind `server`) because the bundle DTOs are part of the wire contract the
# wasm client deserializes — see the re-export in `types.rs`.
adi-dashboards = { workspace = true }

adi-config = { workspace = true, optional = true }
adi-osext = { workspace = true, optional = true }
adi-ports-manager = { workspace = true, optional = true }
adi-mesh = { workspace = true, optional = true }
adi-projects = { workspace = true, optional = true }
adi-secrets = { workspace = true, optional = true }
adi-db = { workspace = true, optional = true }
adi-tasks = { workspace = true, optional = true }
adi-tools = { workspace = true, optional = true }
adi-agents = { workspace = true, optional = true }
adi-knowledge = { workspace = true, optional = true }
adi-events = { workspace = true, optional = true }
adi-hooks = { workspace = true, optional = true }
adi-triggers = { workspace = true, optional = true }
adi-update = { workspace = true, optional = true }
adi-fs = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
# `blocking` because every /api handler is a sync function run on tokio's blocking pool (see
# adi-app's `blocking`), and `multipart` because that is how three of the four speech providers
# take their audio.
reqwest = { workspace = true, features = ["blocking", "multipart"], optional = true }
# reqwest is built with `rustls-no-provider` (see the workspace manifest), so the provider is
# installed by hand on the way to the first request.
rustls = { workspace = true, optional = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
# `POST /api/fleet/invite` draws its token as an SVG (see `handlers::qr`), so the panel's wasm
# never carries an encoder. Encoder only — nothing here reads an image.
qrcode = { workspace = true, optional = true }

[dev-dependencies]
# A QR nobody scanned is an untested feature. `handlers::qr`'s test parses the SVG this crate
# serves back into a module grid and decodes it — with the same reader the browser client points
# its camera through, so both halves of the pairing flow are checked against one decoder.
quircs = { workspace = true }

[lints]
workspace = true
