[package]
name = "adi-relay-server"
description = "The webhook relay service (ADI-MONO-220/222): a small self-hostable binary that answers unauthenticated sender webhooks at /h/<endpoint-id> and a signed, polled pull API for the node that owns them. One binary, one relay.toml, three modes (public/enterprise/self-host) differing only in whose key is accepted. Deliberately not built on adi-db or adi-config — a self-hosting customer has neither installed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "adi-relay-server"
path = "src/main.rs"

[lib]
name = "adi_relay_server"
path = "src/lib.rs"

[dependencies]
# The signed-request canonical string, sealed-box primitives, and OpenSSH key parsing — never
# `adi_relay::keys::load_or_create`, the one function in that crate that assumes `~/.adi/mono/`.
adi-relay = { workspace = true }
adi-osext = { workspace = true, features = ["signals"] }

# The local store: one `rusqlite::Connection` at the path `relay.toml` names, with `adi-db`'s own
# WAL pragmas (same reasoning, duplicated rather than depending on that crate — see this crate's
# own description).
rusqlite = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "signal", "time", "sync", "io-util"] }

# The enterprise-mode licence beam (the real adi-licence-service /v1/verify contract).
reqwest = { workspace = true, features = ["json"] }
rustls = { workspace = true }

# The one place this binary verifies a signature it did not itself make: the licence service's
# response to a beam (`adi-enterprise-beam-wire-contract-v1`).
ed25519-dalek = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# Only for `today()`'s `registrations_by_ip.day` string — a stable UTC calendar date, not
# wall-clock scheduling, so no `chrono-tz` here.
chrono = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
# Self-host's optional `X-Relay-Shared-Secret`: compared in constant time, the same reason
# `adi-mesh`'s own Basic-auth credential check uses it rather than `==`.
subtle = "2"

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
x25519-dalek = { workspace = true }

[lints]
workspace = true
