[package]
name = "adi-mesh"
description = "adi-family peer mesh over iroh: expose a machine's allow-listed local ports to authorized peers, and forward a local port to a peer's allowed port — peer-to-peer (QUIC + relay-assisted NAT traversal), no public IP required."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "adi-mesh"
path = "src/main.rs"

[dependencies]
adi-config = { workspace = true }
adi-osext = { workspace = true, features = ["signals"] }

# Where a paired peer's last-seen activity is recorded (`docs/fleet.md` presence work): the
# platform's shared global database, so a reader outside this process (the control panel's `/api/*`
# handlers, an operator's own query) sees the same answer the gateway just wrote, with no channel of
# its own to keep in sync.
adi-db = { workspace = true }

# The node side of the mesh gateway resolves a service label against *this machine's* hive route
# table (docs/fleet.md C6), so it depends on the front door's routing brain rather than reimplementing
# it — a second lookup would be a second set of rules to keep in step. The direction is acyclic
# (adi-hive knows nothing of the mesh), but it does pull hive's TLS stack (rustls/rcgen) into this
# crate's build; splitting the gateway into its own `adi-gateway` crate is the escape hatch if that
# ever costs more than the duplication would.
adi-hive = { workspace = true }

# The peer-to-peer transport: QUIC connections dialled by EndpointId, with relays doing
# NAT traversal and n0 discovery resolving an id to its current addresses.
iroh = { workspace = true }

clap = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Basic authentication on the node side (see docs/fleet.md §5): base64 decodes the
# `Authorization` header, sha2 hashes the password with a per-node salt, subtle compares the
# digests without leaking their prefix through timing, and rand mints the salt.
# The gateway resolves a service label to a port the same way the front door does, and for a
# service that declares none (every dashboard) that means asking the ports manager for its
# stable lease. Reserving is idempotent and keyed the same, so both sides land on one port.
adi-ports-manager = { workspace = true }

base64 = { workspace = true }
sha2 = { workspace = true }
subtle = "2"
rand = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "signal", "io-util", "sync", "time"] }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
