<!-- The mark at bar size: three hexagons, one in front, monochrome (DESIGN.md §10) — the same
     drawing crates/adi-hive/src/notfound.rs inlines for the front door's pages, in the same
     `currentColor` build at 52% / 74% / 100%.

     It is a copy, and `the_mark_agrees_with_the_canonical_drawing` in src/shell.rs fails if it
     stops being one: every `d` here must appear in crates/adi-webapp/assets/mark.svg, which is
     itself generated from `Mark` in crates/adi-ui/src/mark.rs. A site that carried a mark of its
     own would be the one surface drawing a slightly different logo, and nobody would notice for
     a year. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" aria-hidden="true">
  <defs>
    <mask id="adi-mark-cut-0" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <rect width="200" height="200" fill="#fff"/>
      <path fill="#000" d="M127.71 65.00 L178.81 94.50 L178.81 153.50 L127.71 183.00 L76.62 153.50 L76.62 94.50 Z"/>
      <path fill="#000" d="M100.00 17.00 L151.10 46.50 L151.10 105.50 L100.00 135.00 L48.90 105.50 L48.90 46.50 Z"/>
    </mask>
    <mask id="adi-mark-cut-1" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <rect width="200" height="200" fill="#fff"/>
      <path fill="#000" d="M100.00 17.00 L151.10 46.50 L151.10 105.50 L100.00 135.00 L48.90 105.50 L48.90 46.50 Z"/>
    </mask>
  </defs>
  <path fill="currentColor" fill-opacity="0.52" mask="url(#adi-mark-cut-0)" d="M72.29 68.00 L120.78 96.00 L120.78 152.00 L72.29 180.00 L23.79 152.00 L23.79 96.00 Z"/>
  <path fill="currentColor" fill-opacity="0.74" mask="url(#adi-mark-cut-1)" d="M127.71 68.00 L176.21 96.00 L176.21 152.00 L127.71 180.00 L79.22 152.00 L79.22 96.00 Z"/>
  <path fill="currentColor" d="M100.00 20.00 L148.50 48.00 L148.50 104.00 L100.00 132.00 L51.50 104.00 L51.50 48.00 Z"/>
