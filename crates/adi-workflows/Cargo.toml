[package]
name = "adi-workflows"
description = "The WORKFLOWS engine (ADI-MONO-141 §E): discovers the TypeScript workflow files under `workflows/` and `projects/<id>/workflows/`, starts a run when their `on: schedule(cron, tz) | event(pattern, where?) | manual()` fires, pours its row + root task + `adi.workflows.run.started` event, and drives it — a fresh `bun` process per attempt, relaying each `ctx` checkpoint (step/task/run/waitFor/sleep/ask) over a line-delimited JSON pipe, journaling every resolution so replay is instant and an unresolved checkpoint just suspends the attempt cleanly — through to `adi.workflows.run.completed/failed`. See the crate docs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
adi-config = { workspace = true }
adi-events = { workspace = true }
adi-schedules = { workspace = true }
adi-tasks = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
